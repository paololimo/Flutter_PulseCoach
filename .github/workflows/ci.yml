name: CI

# Verification gate for PulseCoach. The `build apk` step exists specifically to
# catch Android-only build regressions (e.g. missing core-library desugaring)
# that `flutter test` — which runs on the host VM — can never surface. This was
# the root cause of an Epic 22 ship-blocker (E22R-1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pulse_coach

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The core check: exercises the real Android/Gradle build so desugaring,
      # AGP, and manifest regressions fail here instead of on a physical device.
      - name: Build debug APK
        run: flutter build apk --debug
