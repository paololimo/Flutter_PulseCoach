name: CI

# Verification gate for PulseCoach. The `build apk` step exists specifically to
# catch Android-only build regressions (e.g. missing core-library desugaring)
# that `flutter test` — which runs on the host VM — can never surface. This was
# the root cause of an Epic 22 ship-blocker (E22R-1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pulse_coach

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` descends into the nested wear/ package; it needs its
      # own package resolution for `package:pulse_coach_wear/...` self-imports.
      - name: Install wear module dependencies
        working-directory: pulse_coach/wear
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The Google Services Gradle plugin requires google-services.json at build
      # time (gitignored). A placeholder is sufficient for a debug build; the
      # GOOGLE_SERVICES_JSON secret carries it (base64) so the file never lands
      # in git. Swap in a real config later by updating the secret.
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set — the Android build cannot run."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      # The core check: exercises the real Android/Gradle build so desugaring,
      # AGP, and manifest regressions fail here instead of on a physical device.
      - name: Build debug APK
        run: flutter build apk --debug
