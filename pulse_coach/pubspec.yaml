name: pulse_coach
description: "PulseCoach — AI-powered adaptive fitness coaching app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.3.0

  # Dependency Injection
  get_it: ^9.0.0
  injectable: ^3.0.0

  # Functional Programming
  dartz: ^0.10.1

  # Database
  drift: ^2.32.0
  drift_flutter: ^0.3.0

  # Serialization (runtime annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # HTTP Client
  dio: ^5.8.0

  # Routing
  go_router: ^17.0.0

  # UI
  google_fonts: ^8.0.0
  fl_chart: ^1.0.0
  lottie: ^3.3.1
  lucide_icons_flutter: ^3.1.14
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0

  qr_flutter: ^4.1.0

  # In-App Purchases (v2 — RevenueCat)
  purchases_flutter: ^10.3.0
  url_launcher: ^6.3.0

  # Cloud Backend (v2)
  supabase_flutter: ^2.9.0
  storage_client: ^2.5.7
  flutter_secure_storage: ^9.2.0
  cryptography: ^2.7.0
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.0

  # Haptic Feedback
  vibration: ^3.1.8

  # Sensors & Location
  connectivity_plus: ^6.1.0
  health: ^13.3.1
  sensors_plus: ^7.0.0
  geolocator: ^14.0.0

  # WearOS
  wear_plus: ^1.2.4

  # Annotations
  meta: ^1.16.0

  # Internationalisation / Date formatting
  intl: ^0.20.2
  watch_connectivity: ^0.2.8
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^3.0.0
  drift_dev: ^2.32.0
  freezed: ^3.2.5
  json_serializable: ^6.9.0

  # Testing
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  mockito: ^5.4.4
  sqlite3: any
  connectivity_plus_platform_interface: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/data/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
