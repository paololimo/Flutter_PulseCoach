name: pulse_coach
description: "PulseCoach — AI-powered adaptive fitness coaching app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0

  # Dependency Injection
  get_it: ^9.0.0
  injectable: ^3.0.0

  # Functional Programming
  dartz: ^0.10.1

  # Database
  drift: ^2.32.0
  drift_flutter: ^0.3.0

  # Serialization (runtime annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # HTTP Client
  dio: ^5.8.0

  # Routing
  go_router: ^17.0.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Haptic Feedback
  vibration: ^3.1.8

  # Sensors & Location
  health: ^13.3.1
  sensors_plus: ^6.1.0
  geolocator: ^13.0.2

  # WearOS
  wear_plus: ^1.2.4

  # Internationalisation / Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^3.0.0
  drift_dev: ^2.32.0
  freezed: ^3.2.5
  json_serializable: ^6.9.0

  # Testing
  bloc_test: ^10.0.0
  mockito: ^5.4.4
  sqlite3: any

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/data/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
